name: Build Windows Standalone Executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build sn.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build standalone sn.exe
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Smoke test sn.exe
        shell: pwsh
        run: |
          ./dist/sn.exe --help
          ./dist/sn.exe list --help
          ./dist/sn.exe cmdb --help

      - name: Upload sn.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: sn-windows-x64
          path: dist/sn.exe
          if-no-files-found: error

      - name: Attach sn.exe to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sn.exe
          generate_release_notes: true
